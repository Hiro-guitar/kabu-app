<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="株チェック">
<meta name="theme-color" content="#10161d">
<title>株チェック</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="top-l">
      <h1>株チェック</h1>
      <p class="sub" id="built">—</p>
    </div>
    <div class="top-r">
      <button class="ibtn" id="btn-live" type="button" aria-label="株価を更新">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="ibtn" id="btn-help" type="button" aria-label="使い方"><span style="font-size:17px;font-weight:700">?</span></button>
      <button class="ibtn" id="btn-set" type="button" aria-label="設定">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </div>
  </header>
  <p class="live-note" id="live-note" hidden></p>
  <main id="main"></main>
  <nav class="tabs" id="tabs">
    <button type="button" data-v="cand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M17 4v16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="4.5" y="8" width="5" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="14.5" y="6" width="5" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>今日</span></button>
    <button type="button" data-v="watch"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>見守り</span></button>
    <button type="button" data-v="hist"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3.5" width="16" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>記録</span></button>
  </nav>
</div>
<div id="sheet" class="sheet" hidden></div>
<script src="app.js"></script>
</body>
</html>
